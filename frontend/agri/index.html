<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Ethiopian Agri Link | Empowering Farmers Digitally</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="A digital agriculture platform connecting Ethiopian farmers with real-time market prices, expert advice, and emergency alerts."
    />
    <meta
      name="keywords"
      content="Ethiopia agriculture, farmers platform, agri tech, market prices, extension services"
    />
    <meta name="author" content="Ethiopian Agri Platform" />

    <!-- Open Graph (Facebook / WhatsApp) -->
    <meta property="og:title" content="Ethiopian Agri Platform" />
    <meta
      property="og:description"
      content="Empowering Ethiopian farmers with digital tools, market prices, and expert agricultural support."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ethiopian Agri Platform" />
    <meta
      name="twitter:description"
      content="Connecting farmers with market prices and expert advice."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./../agri//src//assets/logo.png" />

    <!-- Mobile UX -->
    <meta name="theme-color" content="#15803d" />

  </head>
